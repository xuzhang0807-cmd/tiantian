name: wordpress
type: wordpress
version: 1
summary: WordPress plus MariaDB behind the /home/web nginx gateway.

defaults:
  project_dir: /home/docker/wordpress
  domain: none
  port_group: wordpress
  ports:
    web: 8085
  nginx:
    enabled: false
    cert_enabled: false
  data:
    wordpress: data
    database: data/db

services:
  - name: tt-wordpress-db
    role: database
    image: mariadb:10.11
    data_paths:
      - ./data/db:/var/lib/mysql
  - name: tt-wordpress
    role: web
    image: wordpress:latest
    local_port: 8085
    data_paths:
      - ./data:/var/www/html
      - ./logs:/var/log/apache2

required_secrets:
  - DB_PASSWORD
  - DB_ROOT_PASSWORD

health_checks:
  local:
    - http://127.0.0.1:8085/

git_policy:
  never_commit:
    - .env
    - data
    - logs
    - backups
