name: sub2api
type: sub2api
version: 1
summary: Sub2API with PostgreSQL and Redis behind nginx.

defaults:
  project_dir: /home/docker/sub2api
  source_dir: /opt/sub2api
  domain: sub2.kazerush.xyz
  port_group: sub2api
  ports:
    api: 8080
  nginx:
    enabled: true
    cert_enabled: true
    https_listen: 127.0.0.1:4443
    acme_webroot: /home/web/letsencrypt
    config_dir: /home/web/conf.d
    cert_dir: /home/web/certs
  data:
    postgres_volume: sub2api_pg_data
    redis_volume: sub2api_redis_data
    app_volume: sub2api_sub2api_data

services:
  - name: sub2-postgres
    role: database
    image: postgres:15-alpine
  - name: sub2-redis
    role: cache
    image: redis:7-alpine
  - name: sub2api
    role: api
    image: weishaw/sub2api:latest
    local_port: 8080

required_secrets:
  - ADMIN_PASSWORD
  - JWT_SECRET
  - DATABASE_PASSWORD
  - REDIS_PASSWORD

health_checks:
  local:
    - http://127.0.0.1:8080/
  external:
    - https://sub2.kazerush.xyz

git_policy:
  never_commit:
    - .env
    - database dumps
    - docker volume data
