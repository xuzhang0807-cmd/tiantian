name: network
type: network
version: 1
summary: nginx stream SNI relay plus sing-box service skeleton. Secrets and generated share links are local-only.

defaults:
  nginx_stream_conf: /home/web/stream.d/reality-relay.conf
  sing_box_config: /etc/sing-box/config.json
  ports:
    public_tls: 443
    vless_reality: 8443
    vless_ws_direct: 8444
    hysteria2_udp: 30888
  service:
    name: sing-box
    systemd: true

components:
  - nginx stream maps SNI to 127.0.0.1:4443, 127.0.0.1:8443, and 127.0.0.1:8444
  - sing-box inbounds vless, hysteria2, and vless websocket direct

required_secrets:
  - server private key
  - UUIDs
  - short IDs
  - generated share links

git_policy:
  commit:
    - stream.conf.tpl
    - sing-box.config.tpl
    - README.md
  never_commit:
    - /etc/sing-box/config.json
    - /etc/sing-box/server.key
    - client links
    - reality private keys
