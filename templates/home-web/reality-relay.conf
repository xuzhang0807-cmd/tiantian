# stream.d/reality-relay.conf
# 1. 定义本地 Nginx HTTP 的后端
upstream nginx_local {
    server 127.0.0.1:4443; # 指向内部 HTTP 端口
}

upstream v2bx_reality {
    server 127.0.0.1:8443;
}

upstream vless_reality {
    server 127.0.0.1:8444;
}


# 关键：根据客户端 SNI 决定是否转发
map $ssl_preread_server_name $target {
    s0.awsstatic.com    v2bx_reality;
    cdn.clashtest.shop    vless_reality;
    default            nginx_local;
}

server {
    listen 443 reuseport;
    listen [::]:443 reuseport;

    ssl_preread on;
    proxy_pass $target;

    # 3. 开启 Proxy Protocol (关键！)
    # 为了让 Nginx 网站能拿到用户真实 IP，需要开启 proxy_protocol
    # 但是 V2bX Reality 通常不支持 proxy_protocol，所以需要通过 map 动态控制
    # 也就是：去 nginx_local 开协议，去 v2bx 关协议。
    # 但 Nginx stream 无法在 proxy_pass 根据 map 动态开关 protocol。
    # -----------------------------------------------------------
    # 【折中方案】：
    # 简单起见，这里我们保持 proxy_protocol off。
    # 如果你需要网站日志里是真实 IP，见文末“进阶修正”。
    proxy_protocol off; 

    proxy_timeout 10m;
    proxy_connect_timeout 60s;
}