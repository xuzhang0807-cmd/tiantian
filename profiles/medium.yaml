# TianTian Ops - Medium Profile
# CPU ≤ 4, MEM ≤ 4096 MB

name: medium
max_projects: 5

recommended:
  - nginx
  - WordPress
  - Node.js
  - Redis
  - PostgreSQL (小型)
  - 静态站点

forbidden:
  - AI 推理服务
  - Elasticsearch
  - 大型数据库集群

limits:
  max_container_memory: 1024
  max_containers: 10
  swap_recommended: true
